<body>

    window.escapeHtml = function (s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    window.state = { db:null, uid:'test-code', isAdmin:false, nameMap:{ 'alpha-1':'Alice Smith', 'test-code':'You' } };
    window.studentName = function(c){ return state.nameMap[c] || null; };
    // Fake Firebase so leaderboard rows actually render for visual checking
    var LBDATA = { 'alpha-1':{best:127,money:240}, 'test-code':{best:18,money:30}, 'beta-9':{best:11,money:5} };
    window.state.db = { ref:function(path){ return {
      get:function(){ return Promise.resolve({ val:function(){ return path==='miningGame' ? LBDATA : null; } }); },
      set:function(){ return Promise.resolve(); }
    }; } };
    localStorage.setItem('pylearn_mining_v1', JSON.stringify({ inv:{1:4,2:2}, money:30, best:18, depth:6, discovered:{1:true,2:true,18:true}, mined:{}, placed:{}, shop:{}, selected:1 }));
  </script>
  <script src="assets/js/binary-mining-module.js?v=test8"></script>
